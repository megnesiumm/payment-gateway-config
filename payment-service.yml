# payment-service.yml — Template สำหรับ Payment Service
server:
  port: 8081

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:paymentdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Business config
payment:
  gateway:
    timeout: 5000
    retry-attempts: 3
    providers:
      - stripe
      - paypal
  encryption:
    enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      version: 1.0.0
      zone: primary

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.payment: DEBUG
